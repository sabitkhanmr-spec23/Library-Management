<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Library Management System</title>

    <!-- Link the external CSS file -->
    <link rel="stylesheet" href="Library.css">
</head>
<body>

    <!-- ===== HEADER: only the title ===== -->
    <header id="header">
        <h2>Library Management System</h2>
    </header>

    <!-- ===== MAIN CONTENT ===== -->
    <main id="main">

        <div id="authBox">
            <h1>Create Account</h1>

            <!-- action="login.html": after a valid registration, the browser opens the Login page.
                 If validateRegister() returns false, the form is not sent. -->
            <form action="login.html" onsubmit="return validateRegister()">

                <label for="fullName">Full Name:</label><br>
                <input type="text" id="fullName">
                <span id="fullNameError" class="error"></span>
                <br><br>

                <label for="email">Email:</label><br>
                <input type="text" id="email">
                <span id="emailError" class="error"></span>
                <br><br>

                <label for="password">Password (min 6 characters):</label><br>
                <input type="password" id="password">
                <span id="passwordError" class="error"></span>
                <br><br>

                <label for="confirmPassword">Confirm Password:</label><br>
                <input type="password" id="confirmPassword">
                <span id="confirmPasswordError" class="error"></span>
                <br>

                <!-- onclick shows or hides BOTH password boxes -->
                <input type="checkbox" id="showRegPass"
                       onclick="togglePassword('password', 'showRegPass'); togglePassword('confirmPassword', 'showRegPass')">
                <label for="showRegPass" style="font-weight: normal;">Show passwords</label>
                <br><br>

                <input type="checkbox" id="terms">
                <label for="terms" style="font-weight: normal;">I agree to the library rules</label>
                <span id="termsError" class="error"></span>
                <br><br>

                <input type="submit" value="Register">
            </form>

            <p>Already have an account? <a href="login.html">Login</a></p>
        </div>

    </main>

    <!-- ===== FOOTER ===== -->
    <footer id="footer">
        <p><b>Web Technologies</b> | Group 03 | Section Y</p>
        <p>American International University-Bangladesh (AIUB)</p>
    </footer>

    <!-- Link the JavaScript file for the login and register pages -->
    <script src="auth.js"></script>

</body>
</html>
