<div class="table-wrap">
<table border="1" cellpadding="8" cellspacing="0">
  <caption>Today at a glance</caption>
  <tr><th>Waiting applications</th><td id="cWaiting">0</td></tr>
  <tr><th>Books on loan</th><td id="cLoans">0</td></tr>
  <tr><th>Due tomorrow</th><td id="cTomorrow">0</td></tr>
  <tr><th>Overdue</th><td id="cOverdue">0</td></tr>
</table>

<form id="dateForm">
  <fieldset>
    <legend>Working Date</legend>
    <p>Change the date to check the day-6 reminder and overdue books.</p>
    <p><label for="workDate">Date</label>
    <input type="date" id="workDate" required>
    <button type="submit">Set Date</button>
    <button type="button" id="dateReset">Use Real Date</button></p>
  </fieldset>
</form>
