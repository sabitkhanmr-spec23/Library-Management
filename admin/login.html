<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Staff Login | City Public Library</title>
<link rel="stylesheet" href="../css/admin/login.css">
</head>
<body class="login">

<h1>Staff Login</h1>
<p><a href="../index.html">Main Page</a></p>
<hr>

<form id="loginForm">
  <fieldset>
    <legend>Librarian Sign In</legend>
    <p><label for="u">Username</label><br>
    <input type="text" id="u" autocomplete="username" required></p>
    <p><label for="p">Password</label><br>
    <input type="password" id="p" autocomplete="current-password" required></p>
    <button type="submit">Sign In</button>
  </fieldset>
</form>

<p id="msg" role="status"></p>
<p><small>Username: admin &nbsp; Password: admin123</small></p>

<script src="../js/admin/login.js"></script>
</body>
</html>
